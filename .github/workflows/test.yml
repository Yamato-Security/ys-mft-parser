name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

jobs:
  build_and_test:
    name: Test MFT Library
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # macos-13 runners are retired; track the latest supported macOS runner.
          - macos-latest
          - windows-latest
    env:
      CARGO_TERM_COLOR: always
    # The NTFS / EWF / AFF disk images under testdata/ are upstream's Git LFS objects and are not
    # stored in this fork (they would use Yamato Security's LFS quota on every run); the tests of
    # the ntfs, ewf and aff crates skip themselves without them. The mft crate's own tests use
    # samples/, which is in the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # The commands above build only the root `mft` crate; the other workspace crates stopped
      # compiling upstream without CI noticing. Compile them too (not the GTK explorer GUI).
      - name: Check the workspace crates
        run: cargo check --workspace --exclude ntfs-explorer-gui --all-targets

      - name: Run tests
        run: cargo test --all-targets --all-features
