name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # AFFLIBv3 test fixtures, pinned in external/refs/repos/sshock__AFFLIBv3.commit.
  AFFLIB_COMMIT: f6e51a8367cff73ea24c0adf09e533483c80ecd4

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --exclude ntfs-explorer-gui --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux also builds the FUSE mount frontend.
          - os: ubuntu-latest
            features: --all-features
          - os: macos-latest
            features: ""
          - os: windows-latest
            features: ""
    env:
      # A test whose disk image is missing fails instead of skipping itself.
      NTFS_TESTDATA_REQUIRED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The NTFS / EWF / AFF disk images under testdata/ are upstream's Git LFS objects. This fork
      # doesn't store them (they would use Yamato Security's LFS quota on every run), so they are
      # downloaded from upstream's LFS store, checked against their pointer files, and cached until
      # the pointers change, so that CI doesn't use upstream's LFS bandwidth on every run either.
      - name: Restore the disk images
        id: testdata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: testdata
          key: lfs-testdata-${{ runner.os }}-${{ hashFiles('testdata/**') }}

      - name: Download the disk images
        if: steps.testdata.outputs.cache-hit != 'true'
        shell: bash
        # Windows runners have `python`, not always `python3`.
        run: |
          set -euo pipefail
          "$(command -v python3 || command -v python)" scripts/fetch_lfs_testdata.py

      - name: Fetch AFFLIBv3 fixtures
        shell: bash
        run: |
          set -euo pipefail
          dest="external/refs/repos/sshock__AFFLIBv3@${AFFLIB_COMMIT}/tests"
          mkdir -p "$dest"
          for f in encrypted.aff encrypted.raw; do
            curl -sSfL --retry 3 -o "$dest/$f" \
              "https://raw.githubusercontent.com/sshock/AFFLIBv3/${AFFLIB_COMMIT}/tests/$f"
          done

      - name: Run tests
        run: cargo test --workspace --exclude ntfs-explorer-gui --all-targets ${{ matrix.features }}

  gui:
    name: NTFS explorer GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install webview dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Run clippy
        run: cargo clippy -p ntfs-explorer-gui --all-targets -- -D warnings

      - name: Run tests
        run: cargo test -p ntfs-explorer-gui

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.90

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check
        run: cargo check --workspace --exclude ntfs-explorer-gui --all-targets
